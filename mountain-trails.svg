<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title">
<title id="title">Pojedynczy szczyt ze śladami narciarzy</title>
<defs>
  <clipPath id="mountain-shape"><path d="M45 397 399 30 755 397Z"/></clipPath>
</defs>
<!-- Jeden wyraźny, jasny szczyt na ciemnym tle sekcji -->
<path d="M45 397 399 30 755 397Z" fill="#f3f0e5" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
<!-- Geometryczna ściana podkreśla kształt pojedynczej góry -->
<path d="m399 30 356 367H548L355 145Z" fill="#ded8cc" clip-path="url(#mountain-shape)"/>
<!-- Śnieżna korona -->
<path d="m399 30-65 68 43-12 22 24 24-23 41 15z" fill="#fffdf7" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
<!-- Różowa linia zjazdu i równoległy ślad nart -->
<g clip-path="url(#mountain-shape)" fill="none" stroke="#ee0089" stroke-linecap="round" stroke-linejoin="round">
 <path d="M395 96C343 119 337 151 389 173S471 207 419 235 309 267 322 307 275 359 208 389" stroke-width="9"/>
 <path d="M407 101C355 124 349 156 401 178S483 212 431 240 321 272 334 312 287 364 220 394" stroke-width="4"/>
</g>
<!-- Żółta linia zjazdu i równoległy ślad nart -->
<g clip-path="url(#mountain-shape)" fill="none" stroke="#ffe600" stroke-linecap="round" stroke-linejoin="round">
 <path d="M407 98C462 121 471 150 430 178S363 221 414 250 526 282 507 319 549 363 622 389" stroke-width="9"/>
 <path d="M419 103C474 126 483 155 442 183S375 226 426 255 538 287 519 324 561 368 634 394" stroke-width="4"/>
</g>
<!-- Drobne ślady śniegu przy podstawie -->
<path d="m126 405 42-6m474 5 38 2" stroke="#f3f0e5" stroke-width="5" stroke-linecap="round" opacity=".8"/>
</svg>
